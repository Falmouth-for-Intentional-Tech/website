# Builds the site with Hugo and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"   # daily rebuild (~6am ET) to refresh the member count

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true
      - name: Fetch member count from Four Norms
        env:
          FOUR_NORMS_API_KEY: ${{ secrets.FOUR_NORMS_API_KEY }}
          FOUR_NORMS_ORG_SLUG: turning-life-on
          FOUR_NORMS_GROUP_SLUG: falmouth-for-intentional-tech
        run: python3 .github/scripts/fetch_fournorms.py
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
