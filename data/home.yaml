# ------------------------------------------------------------
#  Home page content. Edit the text here; the layout is in layouts/index.html.
#  Lines marked TODO are placeholders.
# ------------------------------------------------------------

# Photo across the top of the home page (also used when the site is shared). Set image: "" to hide it.
banner:
  image: "img/nobska-light.jpg"
  alt: "Nobska Light in Woods Hole, seen from the water"
  # Credit shown small in the photo's corner (HTML allowed, as copied from Unsplash).
  credit: 'Photo by <a href="https://unsplash.com/@emiddlephoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Evan Middleton</a> on <a href="https://unsplash.com/photos/white-and-red-lighthouse-on-island-surrounded-by-water-under-white-clouds-during-daytime-OptHIXKHuSQ?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>'

hero:
  eyebrow: "Family to family · Falmouth, MA"
  heading: "Room to grow up."          # TODO: your slogan
  text: >-
    We're Falmouth families who want our kids to have more time to play, think and talk to each other, at school and at home. Technology has a place in school. We would just like it to be a smaller and more purposeful one.

  # Secondary button next to "Join". Leave url "" to hide it.
  secondary_label: "Just send me updates"
  secondary_url: "updates"            # "updates" = the site's updates-only sign-up; or any URL; "" hides it

stat:
  # Live count comes from Four Norms at build time (data/fournorms.json, written by the
  # GitHub Action; needs the FOUR_NORMS_API_KEY repo secret). Fields below are added up.
  count_fields: [registered_member_count, supporter_count]   # email_subscriber_count overlaps these (10 + 4 = 14 in Nov 2026)
  label: "Falmouth community members and counting"
  minimum: 10            # below this, show the fallback instead of a small number
  fallback_number: "New"
  fallback_label: "and growing. Be one of the first Falmouth families to join."

quote:
  # TODO: your own words
  text: >-
    Whatever screen rules your family has, or doesn't have, you're welcome here. Most of us are figuring this out as we go.

  attribution: ""

about:
  heading: "You're not the only one thinking about this"
  paragraphs:
    - >-
      If you've argued about screens at bedtime, wondered why your elementary school student is bringing home a Chromebook, or felt like your kid is the only one without a phone... you're not the only one.
    - >-
      This group grew out of side conversations, and a growing appreciation that we share a lot of the same worries. So, let's get together, compare notes, read the research, and talk with our schools about what we find.
  # Photo shown under the paragraphs above. Set photo: "" to hide it.
  photo: "img/woods-hole-bikes.jpg"
  photo_alt: "Two kids on bikes looking out at the boats on the Woods Hole waterfront"
  leaders: "Organized by volunteers from Falmouth families."   # TODO: names, optional
  # Partner cards shown side by side under "About". Add or remove entries freely.
  partners:
    - name: "Turning Life On"
      text: "Falmouth for Intentional Tech is a community of Turning Life On, a coalition of parent-led groups across Massachusetts."
      url: "https://www.turninglifeon.org/"
      label: "Learn about Turning Life On"
      logo: "img/partners/turning-life-on.png"
    - name: "Schools Beyond Screens"
      text: "Our classroom tech recommendations are adapted from Schools Beyond Screens, a parent-led group working for evidence-based limits on screens in schools."
      url: "https://www.schoolsbeyondscreens.com/"
      label: "Visit Schools Beyond Screens"
      logo: "img/partners/schools-beyond-screens.png"

data:
  heading: "What Massachusetts teens are telling us"
  intro: >-
    Massachusetts high schoolers answered CDC's 2025 Youth Risk Behavior Survey.
    These are statewide numbers. We'd love to add Falmouth data as it becomes available.
  cards:
    - big: "81%"
      label: "use social media several times a day"
    - big: "Only 26%"
      label: "get 8+ hours of sleep on a school night"
    - big: "28%"
      label: "felt sad or hopeless almost every day for 2+ weeks in the past year"
    - big: "1 in 9"
      label: "were bullied electronically in the past year"
  source: "Source: CDC Youth Risk Behavior Survey, Massachusetts high school students, 2025 (YRBS Explorer)."
  pdf_url: ""                          # optional link to full results

goals:
  heading: "What we're working toward"
  cards:
    - title: "Know what the research says"
      text: "Short, plain summaries of the studies, so families can decide for themselves."
    - title: "Better school policies"
      text: "Working with teachers and the district on when classrooms use devices, and on clear phone rules."
    - title: "More time offline, together"
      text: "Get-togethers and shared family agreements. Saying no to screens is easier when other families are saying it too."

# Link cards shown right after "What we're working toward".
learn:
  heading: "Learn more"
  cards:
    - eyebrow: "Classroom Tech"
      title: "What we're asking Falmouth schools to change"
      text: "What we'd like to see change, and how it compares with what the district does now."
      page: "/classroom-tech"
      label: "See our asks"
    - eyebrow: "The Evidence"
      title: "The research and what other districts are doing"
      text: "What studies have found, a five-minute Senate testimony worth watching, and what Cambridge, LA, Worcester and Boston are doing."
      page: "/evidence"
      label: "See the evidence"

closing:
  heading: "You don't have to figure this out alone."
  text: "Join and we'll let you know about meetings, events and ways to pitch in."
