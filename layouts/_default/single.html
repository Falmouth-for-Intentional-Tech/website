{{ define "main" }}

  <h1>{{ .Title }}</h1>
  {{ with .Params.lede }}<div class="lede">{{ . | markdownify }}</div>{{ end }}
</header>
<div class="prose">
{{ .Content }}
</div>
{{ end }}
