<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "" | relURL }}">{{ site.Title }}</a>
    <nav>
      {{ $current := . }}
      {{ range site.Menus.main }}
        {{ if .Params.anchor }}
      <a href="{{ if not $current.IsHome }}{{ "" | relURL }}{{ end }}#{{ .Params.anchor }}">{{ .Name }}</a>
        {{ else }}
      <a href="{{ .URL }}"{{ if $current.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>
        {{ end }}
      {{ end }}
      <a class="btn btn-small" href="{{ partial "signup-url.html" . }}" {{ if not site.Params.signupEndpoint }}target="_blank" rel="noopener"{{ end }}>Join us</a>
    </nav>
  </div>
</header>
